server {
    listen 443 ssl;
    http2 on;
    server_name dns-admin.example.com;

    ssl_certificate     /etc/letsencrypt/live/dns-admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dns-admin.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    client_max_body_size 1m;

    # Vue SPA
    root /opt/secure-dns/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Redirect HTTP -> HTTPS
server {
    listen 80;
    server_name dns-admin.example.com;
    return 301 https://$host$request_uri;
}